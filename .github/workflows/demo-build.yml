name: demo-build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
