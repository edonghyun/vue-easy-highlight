name: Pages

# Builds the demo (examples/vanilla) and deploys it to GitHub Pages at
# https://edonghyun.github.io/overlapmark/. Off until the repository
# variable PAGES_ENABLED is 'true' and Pages is set to deploy from Actions.
on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    deploy:
        if: vars.PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22.22.0
            - run: corepack enable
            - run: pnpm install --frozen-lockfile
            # The site is served from the /overlapmark/ subpath.
            - run: pnpm --filter vanilla-example build --base /overlapmark/
            - uses: actions/upload-pages-artifact@v5
              with:
                  path: examples/vanilla/dist
            - id: deployment
              uses: actions/deploy-pages@v5
