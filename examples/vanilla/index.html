<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>overlapmark playground</title>
        <style>
            :root {
                --bg: #fafaf7;
                --fg: #1d1d1f;
                --muted: #6b6b6b;
                --line: #e2e2dc;
                --panel: #fff;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                padding: 24px;
                background: var(--bg);
                color: var(--fg);
                font:
                    15px/1.5 -apple-system,
                    BlinkMacSystemFont,
                    'Segoe UI',
                    sans-serif;
            }
            h1 {
                font-size: 20px;
                margin: 0 0 4px;
            }
            p.sub {
                color: var(--muted);
                margin: 0 0 16px;
            }
            .controls {
                display: flex;
                flex-wrap: wrap;
                gap: 16px;
                align-items: center;
                padding: 12px 16px;
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 8px;
                margin-bottom: 16px;
            }
            .controls label {
                display: flex;
                gap: 6px;
                align-items: center;
            }
            .panel {
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 8px;
                padding: 16px;
            }
            #stage {
                width: var(--stage-w, 520px);
                max-width: 100%;
                font-size: 18px;
                line-height: 1.7;
                outline: 1px dashed var(--line);
                padding: 4px;
            }
            #status {
                font-family: ui-monospace, monospace;
                font-size: 13px;
                color: var(--muted);
                min-height: 1.5em;
                margin-top: 8px;
            }
            ul#ranges {
                list-style: none;
                padding: 0;
                margin: 12px 0 0;
                display: flex;
                flex-direction: column;
                gap: 4px;
                font-family: ui-monospace, monospace;
                font-size: 12px;
            }
            ul#ranges li {
                display: flex;
                gap: 8px;
                align-items: center;
                flex-wrap: wrap;
            }
            ul#ranges .sw {
                width: 12px;
                height: 12px;
                border-radius: 3px;
                display: inline-block;
            }
        </style>
    </head>
    <body>
        <h1>overlapmark playground</h1>
        <p class="sub">
            Drag over the text to add a highlight. Click a highlight to see
            which highlights cover that spot. Resize the width to check that
            highlights stay aligned with the text.
        </p>

        <div class="controls">
            <label
                >Width
                <input id="w" type="range" min="240" max="720" value="520" />
                <span id="wv">520px</span>
            </label>
            <label
                >Strategy
                <select id="strategy">
                    <option value="layers">
                        layers (stacked per-highlight styles)
                    </option>
                    <option value="depth">
                        depth (darker where they overlap)
                    </option>
                </select>
            </label>
            <label
                >New highlight style
                <select id="preset">
                    <option value="">default (flat)</option>
                    <option value="om-style-marker">om-style-marker</option>
                    <option value="om-style-underline">
                        om-style-underline
                    </option>
                    <option value="om-style-box">om-style-box</option>
                </select>
            </label>
            <label
                >Search and add
                <input
                    id="q"
                    placeholder="type a word, press Enter"
                    size="20"
                />
            </label>
            <button id="reset" type="button">Reset</button>
        </div>

        <section class="panel">
            <div id="stage"></div>
            <div id="status"></div>
            <ul id="ranges"></ul>
        </section>

        <script type="module" src="./main.ts"></script>
    </body>
</html>
